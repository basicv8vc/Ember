name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: no repository writes, no packages, no deployments.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node 24 LTS + PostgreSQL 17)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ember
          POSTGRES_PASSWORD: ember_ci_only
          POSTGRES_DB: ember_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ember -d ember_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # Throwaway credentials for the ephemeral CI service container only.
      DATABASE_URL: postgres://ember:ember_ci_only@127.0.0.1:5432/ember_test
      TEST_DATABASE_URL: postgres://ember:ember_ci_only@127.0.0.1:5432/ember_test
      EMBER_ENV: ci
      EMBER_MODEL_EXECUTION: fake

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.15.0
          run_install: false

      - name: Install Node.js (LTS from .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies (reproducible)
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages (required before typed ESLint / typecheck)
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck (strict)
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Migrate database (first run)
        run: pnpm db:migrate

      - name: Migrate database (idempotent re-run)
        run: pnpm db:migrate

      - name: Integration tests (real PostgreSQL + local workerd)
        run: pnpm test:integration

      - name: Chaos tests (real PostgreSQL)
        run: pnpm test:chaos

      - name: End-to-end tests (real HTTP + PostgreSQL)
        run: pnpm test:e2e

      - name: Demo CLI smoke (fast path)
        run: pnpm demo --scenario fast

  v2-runtime:
    name: V2 Runtime & Local Workerd Gate (Fake Provider)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    env:
      EMBER_ENV: ci
      EMBER_MODEL_EXECUTION: fake

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.15.0
          run_install: false

      - name: Install Node.js (LTS from .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies (reproducible)
        run: pnpm install --frozen-lockfile

      - name: Build V2 Runtime & workspace dependencies
        run: pnpm build

      - name: V2 Runtime unit & workerd unit tests
        run: pnpm exec vitest run --config vitest.unit.config.ts tests/unit/v2-*.test.ts

      - name: V2 Runtime real local workerd integration tests
        run: |
          pnpm exec vitest run --config vitest.integration.config.ts \
            tests/integration/v2-m0-probes.test.ts \
            tests/integration/v2-m1-harness-smoke.test.ts \
            tests/integration/v2-m1-acceptance.test.ts

      - name: Report Full M1 E2E Gate status (BLOCKED until A+B+E+F converge)
        run: |
          {
            echo "### V2-M1 Gate Status"
            echo ""
            echo "| Gate | Status | Notes |"
            echo "| :--- | :--- | :--- |"
            echo "| V2 Runtime Build & Unit Tests | PASS | Fake Provider, no cloud/LLM/Daytona credentials |"
            echo "| V2 Real Local Workerd Integration Tests | PASS | M0 DO/D1 probes + M1 harness smoke + acceptance contract |"
            if [ -z "${EMBER_V2_RUNTIME_CONFIG:-}" ]; then
              echo "| Full M1 E2E Gate (F-1..F-23 & FI-01..FI-16) | BLOCKED | EMBER_V2_RUNTIME_CONFIG unset; awaiting A+B+E+F worker assembly |"
              echo "::warning title=M1 Full E2E Gate BLOCKED::Full M1 E2E tests (F-1..F-23 and FI-01..FI-16) are BLOCKED until A, B1-B4, E, and F converge into an executable A+B+E+F wrangler entrypoint."
            else
              echo "| Full M1 E2E Gate (F-1..F-23 & FI-01..FI-16) | CONFIGURED | Target: ${EMBER_V2_RUNTIME_CONFIG} |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
