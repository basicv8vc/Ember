name: iOS L2 Compile

on:
  pull_request:
    paths:
      - "apps/ios/**"
      - ".github/workflows/ios-l2-compile.yml"

jobs:
  ios-build:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Xcode and simulators
        run: |
          xcodebuild -version
          xcrun simctl list devices available
      - name: Build app and both test bundles (strict concurrency)
        run: |
          set -o pipefail
          xcodebuild \
            -project apps/ios/Ember.xcodeproj \
            -scheme Ember \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/EmberL2DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_STRICT_CONCURRENCY=complete \
            OTHER_SWIFT_FLAGS="-Xfrontend -disable-sandbox" \
            build-for-testing 2>&1 | tee "$RUNNER_TEMP/ember-ios-build.log"
