# Local development database only. No cloud resources, no production credentials.
#
#   pnpm dev:db        start and wait for health
#   pnpm dev:db:down   stop (keeps the named volume)
#
# The port is bound to loopback on purpose. Override EMBER_DB_HOST_PORT if 55432
# clashes with something else on your machine.
name: ember-local

services:
  postgres:
    image: postgres:17-alpine
    container_name: ember-local-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ember
      POSTGRES_PASSWORD: ember_local_dev_only
      POSTGRES_DB: ember
    ports:
      - '127.0.0.1:${EMBER_DB_HOST_PORT:-55432}:5432'
    volumes:
      - ember-postgres-data:/var/lib/postgresql/data
      # Creates the `ember_test` database used by integration tests.
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ember -d ember']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

volumes:
  ember-postgres-data:
    name: ember-local-postgres-data
